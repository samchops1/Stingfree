name: Build Windows agent

# Builds the Falcon DLP backend into a Windows .exe on a real Windows runner
# (PyInstaller can't cross-compile, so this can't be done on Linux/macOS).
# The result is uploaded as a downloadable artifact. Signing is NOT done here
# — the exe is unsigned; sign it with your own cert per build-spec Section 8.

on:
  workflow_dispatch: {}          # lets you run it on demand from the Actions tab
  push:
    branches: [claude/repo-reset-dx104a]
    paths:
      - "backend/**"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # ~600 MB model — the one everyone forgets. Without it the exe launches
      # fine but crashes on the first scan.
      - name: Download spaCy model
        run: python -m spacy download en_core_web_lg

      # --onedir (NOT --onefile: onefile unpacks to temp every launch, trips EDR).
      # --collect-all is mandatory for presidio/spacy/the model; uvicorn is added
      # so PyInstaller bundles its dynamically-imported loop/protocol modules.
      - name: Build with PyInstaller
        run: >
          pyinstaller --onedir --name falcon-dlp-agent
          --collect-all presidio_analyzer
          --collect-all presidio_anonymizer
          --collect-all spacy
          --collect-all en_core_web_lg
          --collect-all uvicorn
          run.py

      # Prove the exe actually starts and blocks a fake SSN before we ship it.
      - name: Smoke test the exe
        run: |
          $exe = "dist\falcon-dlp-agent\falcon-dlp-agent.exe"
          $p = Start-Process -FilePath $exe -PassThru
          try {
            $ok = $false
            for ($i = 0; $i -lt 90; $i++) {
              try {
                $r = Invoke-WebRequest -Uri "http://127.0.0.1:8765/health" -UseBasicParsing -TimeoutSec 2
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ok) { throw "agent did not become healthy within 90s" }
            $body = '{"text":"Client SSN is 123-45-6789","url":"ci"}'
            $scan = Invoke-RestMethod -Uri "http://127.0.0.1:8765/scan" -Method Post -ContentType "application/json" -Body $body
            Write-Host "verdict: $($scan.verdict); findings: $($scan.findings.Count)"
            if ($scan.verdict -ne "block") { throw "expected block verdict, got '$($scan.verdict)'" }
            Write-Host "Smoke test passed: exe starts and blocks a fake SSN."
          } finally {
            if ($p -and -not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: falcon-dlp-agent-windows
          path: backend/dist/falcon-dlp-agent
          if-no-files-found: error
          retention-days: 14
